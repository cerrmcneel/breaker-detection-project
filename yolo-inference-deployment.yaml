apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolo-inference
  namespace: default
  labels:
    app: yolo-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yolo-inference
  template:
    metadata:
      labels:
        app: yolo-inference
    spec:
      hostNetwork: true
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: datainmind
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: yolo-inference
        image: ultralytics/ultralytics:latest
        workingDir: /app
        command:
        - python3
        - -c
        - |
          import subprocess, sys
          print("Installing easyocr inside K3s GPU container...")
          subprocess.run([sys.executable, "-m", "pip", "install", "easyocr"], check=True)
          
          print("Starting GPU Inference Server...")
          import src.model.inference_server
          src.model.inference_server.run_server()
        ports:
        - containerPort: 8088
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/lib/wsl/lib
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        resources:
          limits:
            nvidia.com/gpu: 1
        volumeMounts:
        - name: wsl-libs
          mountPath: /usr/lib/wsl/lib
        - name: dxg
          mountPath: /dev/dxg
        - name: models
          mountPath: /models
        - name: app-volume
          mountPath: /app
      volumes:
      - name: wsl-libs
        hostPath:
          path: /usr/lib/wsl/lib
      - name: dxg
        hostPath:
          path: /dev/dxg
      - name: models
        hostPath:
          path: /mnt/c/ironhack/labs/breaker-detection-project/models
      - name: app-volume
        hostPath:
          path: /mnt/c/ironhack/labs/breaker-detection-project
---
apiVersion: v1
kind: Service
metadata:
  name: yolo-inference-svc
spec:
  selector:
    app: yolo-inference
  ports:
  - protocol: TCP
    port: 8088
    targetPort: 8088
    nodePort: 30088
  type: NodePort
