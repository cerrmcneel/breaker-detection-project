apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolo-inference
  namespace: default
  labels:
    app: yolo-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yolo-inference
  template:
    metadata:
      labels:
        app: yolo-inference
    spec:
      hostNetwork: true
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: datainmind
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: yolo-inference
        image: ultralytics/ultralytics:latest
        command:
        - python3
        - -c
        - |
          import torch
          from ultralytics import YOLO
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json
          import cv2
          import numpy as np
          import cgi

          print("Loading YOLO26-Nano onto GPU...")
          model = YOLO("/models/best.pt")
          model.to("cuda")

          class InferenceHandler(BaseHTTPRequestHandler):
              def do_POST(self):
                  if self.path == "/predict":
                      form = cgi.FieldStorage(
                          fp=self.rfile,
                          headers=self.headers,
                          environ={'REQUEST_METHOD': 'POST'}
                      )
                      if "file" not in form:
                          self.send_response(400)
                          self.end_headers()
                          return
                          
                      file_data = form["file"].file.read()
                      nparr = np.frombuffer(file_data, np.uint8)
                      img = cv2.imdecode(nparr, cv2.IMREAD_COLOR)
                      
                      results = model.predict(img, conf=0.25)
                      predictions = []
                      for r in results:
                          for b in r.boxes:
                              predictions.append({
                                  "box": b.xyxy[0].tolist(),
                                  "class": r.names[int(b.cls[0])],
                                  "conf": float(b.conf[0])
                              })
                      
                      self.send_response(200)
                      self.send_header("Content-type", "application/json")
                      self.end_headers()
                      self.wfile.write(json.dumps({"status": "success", "predictions": predictions}).encode())

          print("Inference API is LIVE on port 8080 (Zero-Dependency Mode)")
          server = HTTPServer(("0.0.0.0", 8080), InferenceHandler)
          server.serve_forever()
        ports:
        - containerPort: 8080
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/lib/wsl/lib
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        resources:
          limits:
            nvidia.com/gpu: 1
        volumeMounts:
        - name: wsl-libs
          mountPath: /usr/lib/wsl/lib
        - name: dxg
          mountPath: /dev/dxg
        - name: models
          mountPath: /models
      volumes:
      - name: wsl-libs
        hostPath:
          path: /usr/lib/wsl/lib
      - name: dxg
        hostPath:
          path: /dev/dxg
      - name: models
        hostPath:
          path: /mnt/c/ironhack/labs/breaker-detection-project/models
---
apiVersion: v1
kind: Service
metadata:
  name: yolo-inference-svc
spec:
  selector:
    app: yolo-inference
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30080
  type: NodePort
