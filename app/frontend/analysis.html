<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanelSafe | Human-in-the-Loop Analysis</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/favicon-180.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #9137af;
            --primary-dark: #6c2583;
            --primary-light: rgba(145, 55, 175, 0.15);
            --primary-border: rgba(145, 55, 175, 0.35);
            --secondary: #73c83c;
            --secondary-dark: #56972d;
            --secondary-light: rgba(115, 200, 60, 0.15);
            --bg: #0b0a0d;
            --card-bg: #141219;
            --card-hover: #1c1824;
            --border: rgba(145, 55, 175, 0.2);
            --text: #ffffff;
            --text-dim: #a9a6b0;
            --text-muted: #6f6c77;
            --accent: #ff4a4a;
            --highlight: #00d2ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(at 0% 0%, rgba(145, 55, 175, 0.15) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(115, 200, 60, 0.1) 0px, transparent 50%);
            color: var(--text);
            height: 100vh;
            width: 100vw;
            margin: 0;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            padding-top: 60px; /* Space for navbar */
        }

        /* --- NAVBAR --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(11, 10, 13, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0.75rem 1.5rem;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(145, 55, 175, 0.18);
        }

        .nav-brand {
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.875rem;
            padding: 7px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--secondary);
            background-color: var(--primary-light);
        }

        /* --- RESIZE HANDLE (between sidebar and viewport) --- */
        .resize-handle {
            width: 8px;
            flex-shrink: 0;
            height: calc(100vh - 60px);
            background: transparent;
            cursor: ew-resize;
            position: relative;
            z-index: 20;
        }

        .resize-handle::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 3px;
            width: 2px;
            background: var(--border);
            transition: background 0.15s;
        }

        .resize-handle:hover::after,
        .resize-handle.dragging::after {
            background: var(--primary);
            width: 3px;
            left: 2.5px;
        }

        /* --- SIDEBAR (LEFT) --- */
        .sidebar {
            width: 34vw;
            max-width: 850px;
            min-width: 360px;
            height: calc(100vh - 60px);
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 0;
            z-index: 10;
            box-shadow: 4px 0 20px rgba(0,0,0,0.4);
            position: relative;
        }

        /* Sidebar Header (Slim & Compact) */
        .sidebar-header {
            padding: 1.25rem 1.5rem 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: rgba(20, 18, 25, 0.95);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .sidebar-title {
            font-size: 1.25rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(45deg, #c767e6, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lang-switcher {
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.25);
            padding: 2px;
            border-radius: 8px;
            border: 1px solid rgba(145, 55, 175, 0.25);
        }

        .lang-btn {
            padding: 4px 8px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Upload States */
        .upload-section {
            transition: all 0.3s ease;
        }

        /* Pre-upload: prominent drop box */
        .upload-zone {
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            background: rgba(145, 55, 175, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .upload-zone:hover {
            border-color: var(--secondary);
            background: rgba(145, 55, 175, 0.12);
            transform: translateY(-1px);
        }

        /* Post-upload: sleek collapsed status strip */
        .file-badge-strip {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(145, 55, 175, 0.1);
            border: 1px solid var(--primary-border);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 0;
        }

        .file-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 170px;
        }

        .btn-replace {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-replace:hover {
            background: var(--primary-light);
            color: var(--text);
            border-color: var(--primary);
        }

        /* Secondary Toolbar (Add Box / Clear) */
        .quick-toolbar {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .tool-btn {
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(20, 18, 25, 0.8);
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .tool-btn:hover {
            background: var(--primary-light);
            color: var(--text);
            border-color: var(--primary);
        }

        .tool-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(145, 55, 175, 0.4);
        }

        /* --- SCROLLABLE DETECTIONS LIST (FULL HEIGHT) --- */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem 1.5rem;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .scroll-area::-webkit-scrollbar { width: 6px; }
        .scroll-area::-webkit-scrollbar-track { background: transparent; }
        .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .scroll-area::-webkit-scrollbar-thumb:hover { background: var(--secondary); }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .list-title {
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .comp-counter {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 800;
            background: var(--primary-light);
            border: 1px solid var(--primary-border);
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .component-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            padding-bottom: 1rem;
        }

        .component-card {
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            cursor: pointer;
        }

        .component-card:hover {
            border-color: var(--primary);
            background: var(--card-hover);
            box-shadow: 0 4px 14px rgba(145, 55, 175, 0.15);
            transform: translateY(-1px);
        }

        .component-card.active {
            border-color: #0088ff;
            background: #151d2a;
            box-shadow: 0 0 0 1px #0088ff, 0 6px 18px rgba(0, 136, 255, 0.2);
        }

        .component-card.highlighted {
            border-color: #f39c12;
            background: #231e15;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.55rem;
            border-radius: 6px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .badge-mcb { background: #1e5ba8; color: #d8ecff; }
        .badge-rcd { background: #b85d11; color: #ffe6cf; }
        .badge-rcd_si { background: #962d85; color: #fce6fa; }
        .badge-mainbreaker { background: #c29505; color: #111; font-weight: 900; }
        .badge-oversurge { background: #3b7e47; color: #dff5e3; }
        .badge-other { background: #4a4754; color: #e1dfe8; }

        .card-number {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 800;
        }

        .confidence-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            margin-left: 2px;
        }

        .conf-high { background: rgba(46, 204, 113, 0.18); color: #2ecc71; }
        .conf-med  { background: rgba(241, 196, 15, 0.18); color: #f1c40f; }
        .conf-low  { background: rgba(231, 76, 60, 0.18); color: #e74c3c; }

        .card-actions {
            margin-left: auto;
            display: flex;
            gap: 0.25rem;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.3rem;
            border-radius: 6px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover { color: var(--primary); background: var(--primary-light); }
        .icon-btn.delete:hover { color: var(--accent); background: rgba(255, 74, 74, 0.15); }

        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        input, select {
            background: #0d0c10;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.55rem 0.75rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: #0088ff;
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 136, 255, 0.25);
            background: #11141c;
        }

        /* --- STICKY BOTTOM FOOTER BAR --- */
        .sidebar-footer {
            display: none;
            flex-direction: column;
            gap: 0.65rem;
            padding: 1rem 1.5rem;
            background: rgba(14, 12, 18, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.3);
        }

        .footer-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        .footer-status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--secondary);
            font-weight: 700;
        }

        .footer-status-dot {
            width: 8px;
            height: 8px;
            background: var(--secondary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--secondary);
        }

        .footer-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            border: none;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--secondary-dark), var(--secondary));
            color: #0b0a0d;
            box-shadow: 0 4px 14px rgba(115, 200, 60, 0.25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(115, 200, 60, 0.4);
            filter: brightness(1.08);
        }

        .btn-secondary {
            background: rgba(145, 55, 175, 0.15);
            color: #d8a7e8;
            border: 1px solid var(--primary-border);
        }
        .btn-secondary:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-2px);
        }

        /* --- VIEWPORT (RIGHT) --- */
        .viewport {
            flex: 1;
            height: calc(100vh - 60px);
            background: #08070a;
            position: relative;
            overflow: hidden;
            display: block;
            cursor: grab;
        }

        .viewport:active { cursor: grabbing; }

        #panel-canvas {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
        }

        /* Floating Canvas HUD Toolbar */
        .canvas-hud {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(18, 16, 23, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 6px 8px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 30;
        }

        .hud-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .hud-btn:hover {
            background: var(--primary-light);
            color: var(--text);
            border-color: var(--primary);
        }

        .hud-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .hud-divider {
            width: 1px;
            height: 20px;
            background: var(--border);
            margin: 0 2px;
        }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 10, 13, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-right-color: var(--secondary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        #file-input { display: none; }

        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255,255,255,0.2);
            pointer-events: none;
        }

        .empty-state svg {
            width: 72px;
            height: 72px;
            margin-bottom: 1rem;
            opacity: 0.35;
        }

        .empty-state p {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* --- MOBILE / NARROW LAYOUT --- */
        @media (max-width: 900px) {
            body {
                flex-direction: column;
                overflow-y: auto;
                height: auto;
                min-height: 100vh;
            }

            .navbar { padding: 0.5rem 1rem; }

            .viewport {
                order: 1;
                width: 100%;
                flex: none;
                height: 50vh;
            }

            .sidebar {
                order: 2;
                width: 100%;
                max-width: none;
                min-width: 0;
                height: auto;
                border-right: none;
                border-top: 1px solid var(--border);
            }

            .scroll-area { overflow-y: visible; max-height: none; }
            .sidebar-footer { position: sticky; bottom: 0; }
        }
    </style>
</head>
<body>
    
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <a href="/" class="nav-brand" data-i18n="nav_brand">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            PanelSafe
        </a>
        <div class="nav-links">
            <a href="/" class="nav-link" data-i18n="nav_home">Inicio</a>
            <a href="/analysis.html" class="nav-link active" data-i18n="nav_analysis">Analizador IA</a>
            <a href="/unifilar/" class="nav-link" data-i18n="nav_unifilar">Generador Unifilar</a>
            <a href="/blog.html" class="nav-link" data-i18n="nav_blog">Blog</a>
        </div>
    </nav>

    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
        <!-- Slim Header -->
        <div class="sidebar-header">
            <div class="header-top">
                <div class="sidebar-title">
                    <i data-lucide="shield-check" style="width: 20px; height: 20px; color: var(--primary);"></i>
                    <span>PanelSafe Analysis</span>
                </div>
                
                <div class="lang-switcher">
                    <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
                    <button class="lang-btn" id="btn-es" onclick="setLanguage('es')">ES</button>
                    <button class="lang-btn" id="btn-fr" onclick="setLanguage('fr')">FR</button>
                </div>
            </div>

            <!-- Upload Zone (Pre-upload) -->
            <div class="upload-section" id="upload-section">
                <div class="upload-zone" id="drop-zone">
                    <i data-lucide="upload-cloud" style="width: 28px; height: 28px; color: var(--primary);"></i>
                    <p style="font-size: 0.88rem; font-weight: 600; color: var(--text);" data-i18n="drop_hint">Click or Drop Image</p>
                    <input type="file" id="file-input" accept="image/*">
                </div>

                <!-- Collapsed File Badge Strip (Post-upload) -->
                <div class="file-badge-strip" id="file-badge-strip">
                    <div class="file-info">
                        <i data-lucide="image" style="width: 16px; height: 16px; color: var(--secondary); flex-shrink:0;"></i>
                        <span class="file-name" id="file-name-display">panel.jpg</span>
                    </div>
                    <button class="btn-replace" id="replace-photo-btn">
                        <i data-lucide="refresh-cw" style="width: 12px; height: 12px;"></i>
                        <span data-i18n="btn_replace">Replace</span>
                    </button>
                </div>
            </div>

            <!-- Secondary Toolbar (Add Box / Clear) -->
            <div class="quick-toolbar" id="quick-toolbar">
                <button class="tool-btn" id="add-comp-btn">
                    <i data-lucide="plus-square" style="width: 15px; height: 15px;"></i>
                    <span data-i18n="btn_add_box">Add Box</span>
                </button>
                <button class="tool-btn" id="clear-btn">
                    <i data-lucide="trash-2" style="width: 15px; height: 15px;"></i>
                    <span data-i18n="btn_clear">Clear</span>
                </button>
            </div>
        </div>

        <!-- FULL-HEIGHT SCROLLABLE DETECTIONS LIST -->
        <div id="results-panel" style="display: none;" class="scroll-area">
            <div class="list-header">
                <span class="list-title" data-i18n="detections_title">Detections</span>
                <span class="comp-counter" id="comp-count">0 FOUND</span>
            </div>
            <div class="component-list" id="component-list">
                <!-- Detection cards injected here -->
            </div>
        </div>

        <!-- STICKY BOTTOM FOOTER BAR -->
        <div class="sidebar-footer" id="sidebar-footer">
            <div class="footer-status">
                <div class="footer-status-pill">
                    <div class="footer-status-dot"></div>
                    <span id="footer-count-text">Ready for export</span>
                </div>
                <span style="font-size: 0.75rem; color: var(--text-muted);">Auto-saved</span>
            </div>
            <div class="footer-actions">
                <button class="btn btn-secondary" id="export-btn">
                    <i data-lucide="database" style="width: 16px; height: 16px;"></i>
                    <span data-i18n="btn_vault">Vault</span>
                </button>
                <button class="btn btn-primary" id="generate-unifilar-btn">
                    <i data-lucide="layout-template" style="width: 16px; height: 16px;"></i>
                    <span data-i18n="btn_generate">Generate Diagram</span>
                </button>
            </div>
        </div>
    </div>

    <!-- DRAG-TO-RESIZE HANDLE -->
    <div class="resize-handle" id="resize-handle" title="Drag to resize"></div>

    <!-- RIGHT VIEWPORT -->
    <div class="viewport" id="viewport-container">
        <!-- Floating Canvas HUD Toolbar -->
        <div class="canvas-hud" id="canvas-hud" style="display: none;">
            <button class="hud-btn" id="hud-zoom-in" title="Zoom In">
                <i data-lucide="zoom-in" style="width: 15px; height: 15px;"></i>
            </button>
            <button class="hud-btn" id="hud-zoom-out" title="Zoom Out">
                <i data-lucide="zoom-out" style="width: 15px; height: 15px;"></i>
            </button>
            <button class="hud-btn" id="hud-fit" title="Fit to Screen">
                <i data-lucide="maximize" style="width: 15px; height: 15px;"></i>
                <span style="font-size: 11px;">Fit</span>
            </button>
            <button class="hud-btn" id="hud-reset" title="Reset View 100%">
                <i data-lucide="rotate-ccw" style="width: 15px; height: 15px;"></i>
            </button>
            <div class="hud-divider"></div>
            <button class="hud-btn" id="hud-draw-mode" title="Draw Box">
                <i data-lucide="crop" style="width: 15px; height: 15px;"></i>
                <span style="font-size: 11px;" data-i18n="btn_draw">Draw</span>
            </button>
        </div>

        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
            <p data-i18n="loading_text" style="font-weight: 600; font-size: 1rem; color: #fff;">Analyzing Panel with AI...</p>
        </div>
        <canvas id="panel-canvas"></canvas>
        <div class="empty-state" id="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <p data-i18n="empty_hint">Drop a panel image to begin analysis</p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // --- I18N DICTIONARY ---
        const translations = {
            en: {
                nav_home: "Home", nav_analysis: "AI Analyzer", nav_unifilar: "Diagram Generator", nav_blog: "Blog",
                btn_clear: "Clear", btn_add_box: "Add Box", btn_vault: "Send to Vault", btn_generate: "Generate Diagram",
                btn_replace: "Replace", btn_draw: "Draw Box",
                drop_hint: "Click or Drop Image",
                detections_title: "Detections",
                found_suffix: "FOUND",
                loading_text: "Analyzing Panel with AI...",
                empty_hint: "Drop a panel image to begin analysis",
                placeholder_value: "Value (e.g. C16)", placeholder_amps: "Amps",
                confirm_resume: "We found a saved draft for this image. Would you like to resume?",
                confirm_clear: "This will delete your current draft. Continue?",
                alert_upload_first: "Upload an image and add components first.",
                alert_no_elements: "No elements to serialize.",
                alert_save_failed: "Failed to save to server.",
                saving_text: "Saving...", vaulted_text: "Vaulted!",
                no_detections: "No components detected in this image.",
                no_detections_hint: "Try a clearer photo with the panel cover open."
            },
            es: {
                nav_home: "Inicio", nav_analysis: "Analizador IA", nav_unifilar: "Generador Unifilar", nav_blog: "Blog",
                btn_clear: "Limpiar", btn_add_box: "Añadir Caja", btn_vault: "Enviar a Bóveda", btn_generate: "Generar Esquema",
                btn_replace: "Cambiar", btn_draw: "Dibujar",
                drop_hint: "Haz clic o arrastra una imagen",
                detections_title: "Detecciones",
                found_suffix: "ENCONTRADOS",
                loading_text: "Analizando el cuadro con IA...",
                empty_hint: "Suelta una imagen del cuadro para comenzar",
                placeholder_value: "Valor (ej. C16)", placeholder_amps: "Amperios",
                confirm_resume: "Encontramos un borrador guardado para esta imagen. ¿Deseas continuarlo?",
                confirm_clear: "Esto eliminará tu borrador actual. ¿Continuar?",
                alert_upload_first: "Primero sube una imagen y añade componentes.",
                alert_no_elements: "No hay elementos para serializar.",
                alert_save_failed: "No se pudo guardar en el servidor.",
                saving_text: "Guardando...", vaulted_text: "¡Guardado!",
                no_detections: "No se detectaron componentes en esta imagen.",
                no_detections_hint: "Prueba con una foto más clara y la tapa del cuadro abierta."
            },
            fr: {
                nav_home: "Accueil", nav_analysis: "Analyseur IA", nav_unifilar: "Générateur de schéma", nav_blog: "Blog",
                btn_clear: "Effacer", btn_add_box: "Ajouter une boîte", btn_vault: "Envoyer au coffre", btn_generate: "Générer schéma",
                btn_replace: "Remplacer", btn_draw: "Dessiner",
                drop_hint: "Cliquez ou déposez une image",
                detections_title: "Détections",
                found_suffix: "TROUVÉS",
                loading_text: "Analyse du tableau par IA...",
                empty_hint: "Déposez une image du tableau pour commencer",
                placeholder_value: "Valeur (ex. C16)", placeholder_amps: "Ampères",
                confirm_resume: "Un brouillon enregistré existe pour cette image. Voulez-vous le reprendre ?",
                confirm_clear: "Cela supprimera votre brouillon actuel. Continuer ?",
                alert_upload_first: "Téléversez d'abord une image et ajoutez des composants.",
                alert_no_elements: "Aucun élément à sérialiser.",
                alert_save_failed: "Échec de l'enregistrement sur le serveur.",
                saving_text: "Enregistrement...", vaulted_text: "Enregistré !",
                no_detections: "Aucun composant détecté dans cette image.",
                no_detections_hint: "Essayez une photo plus nette avec le couvercle du tableau ouvert."
            }
        };

        let currentLang = localStorage.getItem('breakerLang') || 'es';
        if (!translations[currentLang]) currentLang = 'es';

        function T(key) {
            return (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || key;
        }

        function setLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            localStorage.setItem('breakerLang', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });
            if (typeof components !== 'undefined' && components.length) populateSidebar();
        }

        // DOM elements
        const dropZone = document.getElementById('drop-zone');
        const fileBadgeStrip = document.getElementById('file-badge-strip');
        const fileNameDisplay = document.getElementById('file-name-display');
        const replacePhotoBtn = document.getElementById('replace-photo-btn');
        const quickToolbar = document.getElementById('quick-toolbar');
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('panel-canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        const resultsPanel = document.getElementById('results-panel');
        const componentList = document.getElementById('component-list');
        const compCount = document.getElementById('comp-count');
        const sidebarFooter = document.getElementById('sidebar-footer');
        const footerCountText = document.getElementById('footer-count-text');
        const viewport = document.querySelector('.viewport');
        const canvasHud = document.getElementById('canvas-hud');

        // Sidebar Drag Resize
        (function setupSidebarResize() {
            const sidebar = document.querySelector('.sidebar');
            const handle = document.getElementById('resize-handle');
            const SIDEBAR_WIDTH_KEY = 'panelsafe_sidebar_width';
            let isResizing = false;

            const savedWidth = localStorage.getItem(SIDEBAR_WIDTH_KEY);
            if (savedWidth) sidebar.style.width = `${savedWidth}px`;

            handle.addEventListener('mousedown', (e) => {
                isResizing = true;
                handle.classList.add('dragging');
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const min = 360, max = 850;
                const newWidth = Math.min(max, Math.max(min, e.clientX));
                sidebar.style.width = `${newWidth}px`;
            });

            window.addEventListener('mouseup', () => {
                if (!isResizing) return;
                isResizing = false;
                handle.classList.remove('dragging');
                document.body.style.userSelect = '';
                localStorage.setItem(SIDEBAR_WIDTH_KEY, parseInt(sidebar.style.width, 10));
            });
        })();

        let activeComponentIndex = -1;
        let hoveredComponentIndex = -1;
        let draggingHandle = null;
        let isDrawingMode = false;
        let drawingStart = null;
        let tempBox = null;
        let originalImage = null;
        let currentFile = null;
        let components = [];
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastMouseX, lastMouseY;

        // PAN & ZOOM
        viewport.onwheel = (e) => {
            e.preventDefault();
            const zoomFactor = Math.exp(-Math.max(-250, Math.min(250, e.deltaY)) * 0.001);
            const mouseX = e.clientX - viewport.offsetLeft;
            const mouseY = e.clientY - viewport.offsetTop;

            const newScale = scale * zoomFactor;
            if (newScale < 0.05 || newScale > 15) return;

            offsetX = mouseX - (mouseX - offsetX) * zoomFactor;
            offsetY = mouseY - (mouseY - offsetY) * zoomFactor;
            scale = newScale;
            
            drawPanel(activeComponentIndex);
        };

        viewport.onmousedown = (e) => {
            if (e.target.closest('.canvas-hud')) return;

            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const canvasMouseX = (mouseX - offsetX) / scale;
            const canvasMouseY = (mouseY - offsetY) / scale;

            if (isDrawingMode) {
                drawingStart = { x: canvasMouseX, y: canvasMouseY };
                return;
            }

            if (activeComponentIndex !== -1) {
                const comp = components[activeComponentIndex];
                const [x1, y1, x2, y2] = comp.box;
                const hitRadius = 25 / scale;
                
                if (Math.abs(canvasMouseX - x1) < hitRadius && Math.abs(canvasMouseY - y1) < hitRadius) draggingHandle = 'tl';
                else if (Math.abs(canvasMouseX - x2) < hitRadius && Math.abs(canvasMouseY - y1) < hitRadius) draggingHandle = 'tr';
                else if (Math.abs(canvasMouseX - x1) < hitRadius && Math.abs(canvasMouseY - y2) < hitRadius) draggingHandle = 'bl';
                else if (Math.abs(canvasMouseX - x2) < hitRadius && Math.abs(canvasMouseY - y2) < hitRadius) draggingHandle = 'br';
            }

            if (draggingHandle) return;

            // Click bounding box on canvas
            for (let i = components.length - 1; i >= 0; i--) {
                const [bx1, by1, bx2, by2] = components[i].box;
                if (canvasMouseX >= bx1 && canvasMouseX <= bx2 && canvasMouseY >= by1 && canvasMouseY <= by2) {
                    selectComponent(i, true);
                    return;
                }
            }

            // Click outside to deselect
            if (activeComponentIndex !== -1) {
                activeComponentIndex = -1;
                document.querySelectorAll('.component-card').forEach(c => c.classList.remove('active'));
                drawPanel(-1);
            }

            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        };

        function selectComponent(index, focusInput = false) {
            if (index < 0 || index >= components.length) return;
            activeComponentIndex = index;
            
            const cards = document.querySelectorAll('.component-card');
            cards.forEach((c, i) => {
                const isActive = (i === index);
                c.classList.toggle('active', isActive);
                if (isActive) {
                    c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    if (focusInput) {
                        const input = c.querySelector('input');
                        if (input) {
                            setTimeout(() => input.focus(), 150);
                        }
                    }
                }
            });

            zoomToComponent(index);
        }

        window.onmousemove = (e) => {
            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const canvasMouseX = (mouseX - offsetX) / scale;
            const canvasMouseY = (mouseY - offsetY) / scale;

            // Update hovered box when not dragging
            if (!isDragging && !draggingHandle && !drawingStart && components.length > 0) {
                let foundHover = -1;
                for (let i = components.length - 1; i >= 0; i--) {
                    const [bx1, by1, bx2, by2] = components[i].box;
                    if (canvasMouseX >= bx1 && canvasMouseX <= bx2 && canvasMouseY >= by1 && canvasMouseY <= by2) {
                        foundHover = i;
                        break;
                    }
                }
                if (foundHover !== hoveredComponentIndex) {
                    hoveredComponentIndex = foundHover;
                    drawPanel(activeComponentIndex);
                    document.querySelectorAll('.component-card').forEach((card, idx) => {
                        card.classList.toggle('highlighted', idx === hoveredComponentIndex && idx !== activeComponentIndex);
                    });
                }
            }

            if (drawingStart) {
                tempBox = [
                    Math.min(drawingStart.x, canvasMouseX),
                    Math.min(drawingStart.y, canvasMouseY),
                    Math.max(drawingStart.x, canvasMouseX),
                    Math.max(drawingStart.y, canvasMouseY)
                ];
                drawPanel(activeComponentIndex);
                return;
            }

            if (draggingHandle && activeComponentIndex !== -1) {
                const comp = components[activeComponentIndex];
                if (draggingHandle === 'tl') { comp.box[0] = canvasMouseX; comp.box[1] = canvasMouseY; }
                else if (draggingHandle === 'tr') { comp.box[2] = canvasMouseX; comp.box[1] = canvasMouseY; }
                else if (draggingHandle === 'bl') { comp.box[0] = canvasMouseX; comp.box[3] = canvasMouseY; }
                else if (draggingHandle === 'br') { comp.box[2] = canvasMouseX; comp.box[3] = canvasMouseY; }
                
                if (comp.box[2] < comp.box[0] + 10) comp.box[2] = comp.box[0] + 10;
                if (comp.box[3] < comp.box[1] + 10) comp.box[3] = comp.box[1] + 10;
                
                drawPanel(activeComponentIndex);
                return;
            }

            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            offsetX += dx;
            offsetY += dy;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            drawPanel(activeComponentIndex);
        };

        window.onmouseup = () => {
            if (drawingStart && tempBox) {
                const newComp = {
                    class: "MCB",
                    box: tempBox,
                    ocr_text: "",
                    confidence: 1.0
                };
                components.push(newComp);
                drawingStart = null;
                tempBox = null;
                setDrawingMode(false);
                saveToLocalStorage();
                populateSidebar();
                selectComponent(components.length - 1, true);
            }
            drawingStart = null;
            isDragging = false;
            if (draggingHandle) {
                draggingHandle = null;
                saveToLocalStorage();
            }
        };

        // KEYBOARD SHORTCUTS
        window.addEventListener('keydown', (e) => {
            const isTyping = ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName);
            if (e.key === 'Escape') {
                if (isDrawingMode) setDrawingMode(false);
                if (activeComponentIndex !== -1) {
                    activeComponentIndex = -1;
                    document.querySelectorAll('.component-card').forEach(c => c.classList.remove('active'));
                    drawPanel(-1);
                }
            } else if ((e.key === 'Delete' || e.key === 'Backspace') && !isTyping && activeComponentIndex !== -1) {
                deleteComponent(null, activeComponentIndex);
            }
        });

        // FILE HANDLING & COLLAPSE TRANSITION
        async function handleFile(file) {
            if (!file) return;
            currentFile = file;
            
            const draftKey = `panelsafe_draft_${file.name}_${file.size}`;
            const existingDraft = localStorage.getItem(draftKey);
            
            if (existingDraft && confirm(T('confirm_resume'))) {
                components = JSON.parse(existingDraft);
                renderAnalysis(file, components);
                return;
            }

            loading.style.display = 'flex';
            const formData = new FormData();
            formData.append('file', file);
            try {
                const response = await fetch('/predict/', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.status === 'success' && data.panel_layout.length > 0) {
                    components = data.panel_layout.map(c => ({
                        ...c,
                        confidence: c.conf || c.confidence || 0
                    }));
                    renderAnalysis(file, components);
                } else if (data.status === 'success' && data.panel_layout.length === 0) {
                    loading.style.display = 'none';
                    const emptyEl = document.getElementById('empty-state');
                    emptyEl.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:72px;height:72px;opacity:0.35;margin-bottom:1rem;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z" />
                        </svg>
                        <p style="color:rgba(255,255,255,0.4)">${T('no_detections')}</p>
                        <p style="font-size:0.85rem;color:rgba(255,255,255,0.25);margin-top:0.5rem">${T('no_detections_hint')}</p>
                    `;
                }
            } catch (err) { alert("Error analyzing panel: " + err.message); }
            finally { loading.style.display = 'none'; }
        }

        function renderAnalysis(file, data) {
            const reader = new FileReader();
            reader.onload = (e) => {
                originalImage = new Image();
                originalImage.onload = () => {
                    canvas.width = originalImage.width;
                    canvas.height = originalImage.height;
                    fitToScreen();
                    
                    // Switch dropzone to collapsed badge strip
                    dropZone.style.display = 'none';
                    fileBadgeStrip.style.display = 'flex';
                    fileNameDisplay.textContent = file.name;
                    quickToolbar.style.display = 'grid';
                    canvasHud.style.display = 'flex';
                    resultsPanel.style.display = 'flex';
                    sidebarFooter.style.display = 'flex';
                    document.getElementById('empty-state').style.display = 'none';

                    populateSidebar();
                    lucide.createIcons();
                };
                originalImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function fitToScreen() {
            if (!originalImage) return;
            scale = Math.min((viewport.clientWidth - 40) / canvas.width, (viewport.clientHeight - 40) / canvas.height);
            offsetX = (viewport.clientWidth - canvas.width * scale) / 2;
            offsetY = (viewport.clientHeight - canvas.height * scale) / 2;
            drawPanel(activeComponentIndex);
        }

        function drawPanel(activeIndex = -1) {
            if (!originalImage) return;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            canvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            ctx.drawImage(originalImage, 0, 0);

            components.forEach((comp, index) => {
                const [x1, y1, x2, y2] = comp.box;
                const isActive = (index === activeIndex);
                const isHovered = (index === hoveredComponentIndex && !isActive);

                if (isActive) {
                    ctx.strokeStyle = '#0088ff';
                    ctx.lineWidth = 6 / scale;
                    ctx.fillStyle = 'rgba(0, 136, 255, 0.22)';
                } else if (isHovered) {
                    ctx.strokeStyle = '#f39c12';
                    ctx.lineWidth = 4 / scale;
                    ctx.fillStyle = 'rgba(243, 156, 18, 0.18)';
                } else {
                    ctx.strokeStyle = 'rgba(0, 150, 255, 0.45)';
                    ctx.lineWidth = 3 / scale;
                    ctx.fillStyle = 'transparent';
                }

                ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

                // Label pill above box
                const fontSize = Math.max(12, Math.min(22, 16 / scale));
                ctx.font = `bold ${fontSize}px Inter, sans-serif`;
                const label = `#${index + 1} ${comp.class}`;
                const textWidth = ctx.measureText(label).width;
                
                ctx.fillStyle = isActive ? '#0088ff' : isHovered ? '#f39c12' : 'rgba(15, 12, 20, 0.85)';
                ctx.fillRect(x1, y1 - fontSize - 6, textWidth + 8, fontSize + 6);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(label, x1 + 4, y1 - 4);

                if (isActive) {
                    // Drag handles
                    ctx.fillStyle = '#ff4a4a';
                    const hs = 18 / scale;
                    ctx.fillRect(x1 - hs/2, y1 - hs/2, hs, hs);
                    ctx.fillRect(x2 - hs/2, y1 - hs/2, hs, hs);
                    ctx.fillRect(x1 - hs/2, y2 - hs/2, hs, hs);
                    ctx.fillRect(x2 - hs/2, y2 - hs/2, hs, hs);
                }
            });

            if (tempBox) {
                ctx.setLineDash([8/scale, 6/scale]);
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3 / scale;
                ctx.strokeRect(tempBox[0], tempBox[1], tempBox[2] - tempBox[0], tempBox[3] - tempBox[1]);
                ctx.setLineDash([]);
            }
        }

        function zoomToComponent(index) {
            activeComponentIndex = index;
            const comp = components[index];
            const [x1, y1, x2, y2] = comp.box;
            const w = x2 - x1;
            const h = y2 - y1;

            const targetScale = Math.min(viewport.clientWidth / w, viewport.clientHeight / h) * 0.45;
            scale = Math.max(0.4, Math.min(targetScale, 2.5));

            offsetX = viewport.clientWidth / 2 - (x1 + w / 2) * scale;
            offsetY = viewport.clientHeight / 2 - (y1 + h / 2) * scale;

            drawPanel(index);
        }

        function populateSidebar() {
            componentList.innerHTML = '';
            compCount.innerText = `${components.length} ${T('found_suffix')}`;
            if (footerCountText) footerCountText.innerText = `${components.length} Breakers Ready`;

            components.forEach((comp, index) => {
                const card = document.createElement('div');
                card.className = 'component-card';
                if (index === activeComponentIndex) card.classList.add('active');
                
                let inputsHtml = '';
                if (['RCD', 'RCD_SI'].includes(comp.class)) {
                    inputsHtml = `
                        <select onchange="updateComp(${index}, 'sensitivity', this.value)">
                            <option value="30mA" ${comp.sensitivity === '30mA' ? 'selected' : ''}>30mA</option>
                            <option value="300mA" ${comp.sensitivity === '300mA' ? 'selected' : ''}>300mA</option>
                        </select>
                        <input type="number" placeholder="${T('placeholder_amps')}" value="${comp.amperage || ''}" oninput="updateComp(${index}, 'amperage', this.value)">
                    `;
                } else {
                    inputsHtml = `
                        <input type="text" placeholder="${T('placeholder_value')}" value="${comp.ocr_text || ''}" oninput="updateComp(${index}, 'ocr_text', this.value)">
                    `;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <span class="badge badge-${comp.class.toLowerCase()}">${comp.class}</span>
                        <span class="card-number">#${index+1}</span>
                        ${(() => {
                            const conf = Math.round((comp.confidence || 0) * 100);
                            const cls = conf >= 80 ? 'conf-high' : conf >= 50 ? 'conf-med' : 'conf-low';
                            return `<span class="confidence-badge ${cls}">${conf}%</span>`;
                        })()}
                        <div class="card-actions">
                            <button class="icon-btn" title="Merge with next" onclick="mergeComponents(event, ${index})"><i data-lucide="merge" style="width: 14px; height: 14px;"></i></button>
                            <button class="icon-btn delete" title="Delete" onclick="deleteComponent(event, ${index})"><i data-lucide="trash-2" style="width: 14px; height: 14px;"></i></button>
                        </div>
                    </div>
                    <div class="inputs-grid">
                        <select onchange="updateComp(${index}, 'class', this.value)">
                            <option value="MCB" ${comp.class === 'MCB' ? 'selected' : ''}>MCB</option>
                            <option value="MAINBREAKER" ${comp.class === 'MAINBREAKER' ? 'selected' : ''}>IGA</option>
                            <option value="RCD" ${comp.class === 'RCD' ? 'selected' : ''}>RCD</option>
                            <option value="RCD_SI" ${comp.class === 'RCD_SI' ? 'selected' : ''}>RCD SI</option>
                            <option value="OVERSURGE" ${comp.class === 'OVERSURGE' ? 'selected' : ''}>Oversurge</option>
                            <option value="OTHER" ${comp.class === 'OTHER' ? 'selected' : ''}>Other</option>
                        </select>
                        ${inputsHtml}
                    </div>
                `;
                card.onclick = (e) => {
                    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT' && !e.target.closest('.card-actions')) {
                        selectComponent(index, true);
                    }
                };
                card.onmouseenter = () => {
                    hoveredComponentIndex = index;
                    drawPanel(activeComponentIndex);
                };
                card.onmouseleave = () => {
                    hoveredComponentIndex = -1;
                    drawPanel(activeComponentIndex);
                };

                componentList.appendChild(card);
            });
            lucide.createIcons();
        }

        window.deleteComponent = (e, index) => {
            if (e) e.stopPropagation();
            components.splice(index, 1);
            if (activeComponentIndex === index) activeComponentIndex = -1;
            saveToLocalStorage();
            drawPanel(activeComponentIndex);
            populateSidebar();
        };

        window.mergeComponents = (e, index) => {
            if (e) e.stopPropagation();
            if (index >= components.length - 1) return;
            const c1 = components[index];
            const c2 = components[index + 1];
            components[index] = { 
                ...c1, 
                box: [Math.min(c1.box[0], c2.box[0]), Math.min(c1.box[1], c2.box[1]), Math.max(c1.box[2], c2.box[2]), Math.max(c1.box[3], c2.box[3])], 
                ocr_text: (c1.ocr_text + " " + c2.ocr_text).trim() 
            };
            components.splice(index + 1, 1);
            saveToLocalStorage();
            drawPanel(activeComponentIndex);
            populateSidebar();
        };

        window.updateComp = (index, field, value) => {
            components[index][field] = value;
            saveToLocalStorage();
            if (field === 'class') {
                populateSidebar();
            }
            drawPanel(activeComponentIndex);
        };

        function saveToLocalStorage() {
            if (!originalImage || !components.length) return;
            const file = currentFile || (fileInput.files && fileInput.files[0]);
            if (file) {
                const draftKey = `panelsafe_draft_${file.name}_${file.size}`;
                localStorage.setItem(draftKey, JSON.stringify(components));
            }
        }

        function setDrawingMode(active) {
            isDrawingMode = active;
            const addBtn = document.getElementById('add-comp-btn');
            const hudDrawBtn = document.getElementById('hud-draw-mode');
            if (isDrawingMode) {
                addBtn.classList.add('active');
                hudDrawBtn.classList.add('active');
                viewport.style.cursor = 'crosshair';
            } else {
                addBtn.classList.remove('active');
                hudDrawBtn.classList.remove('active');
                viewport.style.cursor = 'grab';
            }
        }

        document.getElementById('add-comp-btn').onclick = () => setDrawingMode(!isDrawingMode);
        document.getElementById('hud-draw-mode').onclick = () => setDrawingMode(!isDrawingMode);

        document.getElementById('hud-zoom-in').onclick = () => {
            scale = Math.min(scale * 1.3, 15);
            drawPanel(activeComponentIndex);
        };
        document.getElementById('hud-zoom-out').onclick = () => {
            scale = Math.max(scale / 1.3, 0.05);
            drawPanel(activeComponentIndex);
        };
        document.getElementById('hud-fit').onclick = fitToScreen;
        document.getElementById('hud-reset').onclick = () => {
            scale = 1;
            offsetX = (viewport.clientWidth - canvas.width) / 2;
            offsetY = (viewport.clientHeight - canvas.height) / 2;
            drawPanel(activeComponentIndex);
        };

        document.getElementById('clear-btn').onclick = () => {
            if (confirm(T('confirm_clear'))) {
                const file = currentFile || (fileInput.files && fileInput.files[0]);
                if (file) {
                    const draftKey = `panelsafe_draft_${file.name}_${file.size}`;
                    localStorage.removeItem(draftKey);
                }
                location.reload();
            }
        };

        replacePhotoBtn.onclick = () => fileInput.click();
        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        // Drag & drop on dropZone and viewport
        [dropZone, viewport].forEach(target => {
            target.ondragover = (e) => { e.preventDefault(); if (dropZone) dropZone.style.borderColor = '#0088ff'; };
            target.ondragleave = () => { if (dropZone) dropZone.style.borderColor = 'var(--primary)'; };
            target.ondrop = (e) => {
                e.preventDefault();
                if (dropZone) dropZone.style.borderColor = 'var(--primary)';
                if (e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            };
        });

        // SEND TO VAULT
        document.getElementById('export-btn').onclick = async () => {
            const file = currentFile || (fileInput.files && fileInput.files[0]);
            if (!file || components.length === 0) return alert(T('alert_upload_first'));

            const btn = document.getElementById('export-btn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader" style="width:16px;height:16px;"></i> ${T('saving_text')}`;
            lucide.createIcons();
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('annotations', JSON.stringify(components, null, 4));
            
            try {
                const response = await fetch('/active-learning/save', { method: 'POST', body: formData });
                if (response.ok) {
                    btn.innerHTML = `<i data-lucide="check-circle" style="width:16px;height:16px;"></i> ${T('vaulted_text')}`;
                    btn.style.background = 'rgba(46, 204, 113, 0.2)';
                    btn.style.color = '#2ecc71';
                    lucide.createIcons();
                    setTimeout(() => { 
                        btn.innerHTML = originalHtml; 
                        btn.style.background = '';
                        btn.style.color = '';
                        lucide.createIcons(); 
                    }, 2500);
                } else {
                    alert(T('alert_save_failed'));
                    btn.innerHTML = originalHtml;
                    lucide.createIcons();
                }
            } catch (err) {
                alert("Error: " + err);
                btn.innerHTML = originalHtml;
                lucide.createIcons();
            }
        };

        // --- UNIFILAR SERIALIZATION & REDIRECT ---
        function serializeToShorthand() {
            if (!components || components.length === 0) return '';
            
            const igas = components.filter(c => c.class === 'MAINBREAKER');
            const spds = components.filter(c => c.class === 'OVERSURGE');
            const rcds = components.filter(c => ['RCD', 'RCD_SI'].includes(c.class));
            const mcbs = components.filter(c => c.class === 'MCB');
            
            let lines = [];
            lines.push("// PanelSafe Shorthand Code - Esquema Unifilar");
            lines.push("// Formato: [TIPO:RATING:CABLE:TUBO] -> Destino\n");
            
            let mainChain = [];
            
            // IGA
            if (igas.length > 0) {
                const iga = igas[0];
                const rating = iga.ocr_text || iga.amperage || '40A';
                const cleanRating = rating.endsWith('A') ? rating : rating + 'A';
                mainChain.push(`[IGA:${cleanRating}:2P]`);
            } else {
                mainChain.push(`[IGA:40A:2P]`);
            }
            
            // SPD
            if (spds.length > 0) {
                mainChain.push(`[SPD]`);
            }
            
            // First RCD
            if (rcds.length > 0) {
                const rcd = rcds[0];
                const rcdType = rcd.class === 'RCD_SI' ? 'RCD_SI' : 'RCD';
                const amp = rcd.amperage || '40A';
                const sens = rcd.sensitivity || '30mA';
                const cleanAmp = amp.endsWith('A') ? amp : amp + 'A';
                mainChain.push(`[${rcdType}:${cleanAmp}:${sens}:2P]`);
            } else {
                mainChain.push(`[RCD:40A:30mA:2P]`);
            }
            
            lines.push(mainChain.join(" -> "));
            lines.push("");
            
            // MCBs
            lines.push("// Circuitos de protección individual (REBT)");
            mcbs.forEach((mcb, idx) => {
                const rawVal = (mcb.ocr_text || '').toUpperCase().trim();
                let amp = '16A';
                let label = `C${idx + 1}`;
                
                const numericMatch = rawVal.match(/(\d+)/);
                if (numericMatch) {
                    amp = numericMatch[1] + 'A';
                }
                
                let cable = '2.5mm';
                let tube = 'T20';
                
                if (amp === '10A') {
                    cable = '1.5mm';
                    tube = 'T18';
                    label = 'C1 (Alumbrado)';
                } else if (amp === '16A') {
                    cable = '2.5mm';
                    tube = 'T20';
                    if (idx === 0) label = 'C2 (Tomas de Corriente)';
                    else if (idx === 1) label = 'C5 (Baños y Cocina)';
                    else label = `C2_Aux_${idx}`;
                } else if (amp === '20A') {
                    cable = '4mm';
                    tube = 'T20';
                    label = 'C4 (Lavadora / Termo)';
                } else if (amp === '25A') {
                    cable = '6mm';
                    tube = 'T25';
                    label = 'C3 (Cocina y Horno)';
                } else if (amp === '32A') {
                    cable = '10mm';
                    tube = 'T32';
                    label = 'C13 (Vehículo Eléctrico)';
                } else {
                    label = `C_Circuit_${idx + 1}`;
                }
                
                lines.push(`[PIA:${amp}:${cable}:${tube}] -> ${label}`);
            });
            
            if (rcds.length > 1) {
                lines.push("");
                lines.push("// Diferenciales adicionales detectados");
                for (let i = 1; i < rcds.length; i++) {
                    const rcd = rcds[i];
                    const rcdType = rcd.class === 'RCD_SI' ? 'RCD_SI' : 'RCD';
                    const amp = rcd.amperage || '40A';
                    const sens = rcd.sensitivity || '30mA';
                    const cleanAmp = amp.endsWith('A') ? amp : amp + 'A';
                    lines.push(`[${rcdType}:${cleanAmp}:${sens}:2P] -> circuito_secundario_${i}`);
                }
            }
            
            return lines.join("\n");
        }

        document.getElementById('generate-unifilar-btn').onclick = () => {
            const shorthandCode = serializeToShorthand();
            if (!shorthandCode) {
                alert(T('alert_no_elements'));
                return;
            }
            localStorage.setItem("panelsafe_unifilar_code", shorthandCode);
            window.location.href = "/unifilar/";
        };

        // Initialize language
        setLanguage(currentLang);
    </script>
</body>
</html>
