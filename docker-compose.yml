version: '3.8'

services:
  web:
    build: .
    container_name: breaker-app
    extra_hosts:
      - "gpu-worker:192.168.1.147"
    environment:
      - UPLOAD_DIR=data/images/raw_uploads
      - INFERENCE_URL=http://gpu-worker:8080/predict
    ports:
      - "8085:8000"
    volumes:
      - ./data:/app/data
      - ./app/app/frontend:/app/app/frontend
    restart: always

  cloudflared-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
