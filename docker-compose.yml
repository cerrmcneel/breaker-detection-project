version: '3.8'

services:
  web:
    build: .
    container_name: breaker-app
    extra_hosts:
      - "gpu-worker:100.102.124.29"
    environment:
      - UPLOAD_DIR=data/images/raw_uploads
      - INFERENCE_URL=http://gpu-worker:8088/predict
      # Inference failover: the Modal deployment in deploy/modal_failover.py
      # (T4 GPU, scale-to-zero, ships the model weights via add_local_dir).
      # Measured 2026-08-16: 16.1s cold, ~4s warm.
      #
      # This must NOT point at the Azure App Service. api-cloud.panelsafe.cv is a
      # bound hostname on the app that runs this very gateway, so pointing here at
      # Azure makes the failover call itself; and that app cannot serve inference
      # anyway (no weights, lean requirements). See the roadmap.
      - FAILOVER_URL=https://ericmcneel--panelsafe-failover-inference-asgi.modal.run/predict
    ports:
      - "8085:8000"
    volumes:
      - ./data:/code/data
      - ./app/frontend:/code/app/frontend
    restart: always

  cloudflared-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    # Pinned deliberately, kept even after the host-level DNS root cause (empty
    # Tailscale Global Nameservers) was fixed 2026-07-27. This is the container
    # that breaks public site availability if DNS fails again -- cheap insurance
    # against a repeat, not leftover debugging config.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - default
      - marjal_net
      - portfolio_net

networks:
  default:
    name: breaker-detection-project_default
  marjal_net:
    external: true
    name: marjal-website_default
  portfolio_net:
    external: true
    name: ericmcneel-portfolio_default

