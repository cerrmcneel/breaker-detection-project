version: '3.8'

services:
  web:
    build: .
    container_name: breaker-app
    extra_hosts:
      - "gpu-worker:100.102.124.29"
    environment:
      - UPLOAD_DIR=data/images/raw_uploads
      - INFERENCE_URL=http://gpu-worker:8088/predict
      # PRIMARY_ENGINE would otherwise be derived from INFERENCE_URL's hostname
      # ("Primary:gpu-worker"). Pinned here to a friendlier audit-trail label. No
      # override is set on Azure, so its label correctly derives from whatever
      # INFERENCE_URL actually points at there.
      #
      # Was "K3s-GPU-Cluster-Pipeline" until 2026-09-17. That was inherited from the
      # May 2026 setup and became wrong when the worker moved off K3s to a native
      # Windows process (Scheduled Task PanelSafeInference). Old rows in the
      # predictions store still carry the K3s label.
      - PRIMARY_ENGINE=Local-GPU-RTX3060
      # Inference failover: the Modal deployment in deploy/modal_failover.py
      # (T4 GPU, scale-to-zero, ships the model weights via add_local_dir).
      # Measured 2026-08-16: 16.1s cold, ~4s warm.
      #
      # This must NOT point at the Azure App Service. api-cloud.panelsafe.cv is a
      # bound hostname on the app that runs this very gateway, so pointing here at
      # Azure would make the failover call itself. (As of 2026-08-26 Azure's own
      # INFERENCE_URL points directly at this same Modal endpoint below, so it now
      # serves real inference itself rather than needing to be a failover target.)
      - FAILOVER_URL=https://ericmcneel--panelsafe-failover-inference-asgi.modal.run/predict
    ports:
      - "8085:8000"
    volumes:
      - ./data:/code/data
      - ./app/frontend:/code/app/frontend
    restart: always

  cloudflared-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    # Pinned deliberately, kept even after the host-level DNS root cause (empty
    # Tailscale Global Nameservers) was fixed 2026-07-27. This is the container
    # that breaks public site availability if DNS fails again -- cheap insurance
    # against a repeat, not leftover debugging config.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - default
      - marjal_net
      - portfolio_net

networks:
  default:
    name: breaker-detection-project_default
  marjal_net:
    external: true
    name: marjal-website_default
  portfolio_net:
    external: true
    name: ericmcneel-portfolio_default

