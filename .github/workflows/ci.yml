      # - name: Push image
      #   if: github.ref == 'refs/heads/main'
      #   run: |
      #     docker tag breaker-detection-project:ci ghcr.io/${{ github.repository }}:latest
      #     docker push ghcr.io/${{ github.repository }}:latest
